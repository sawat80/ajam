# Standalone stack for GitHub Codespaces: just the two containers (db + ojs).
# OJS is served at the ROOT of the forwarded port (no Nginx, no /ojs subpath).
# Used by .devcontainer/codespaces-up.sh, which installs OJS and points its
# base_url at the Codespace's public forwarded URL.
#
#   COMPOSE_FILE=docker-compose.codespaces.yml docker compose up -d
#
# Data lives in named volumes (ephemeral with the Codespace).

name: ajam-cs

services:
  db:
    image: mariadb:11.4
    container_name: ajam-cs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ojs
      MARIADB_USER: ojs
      MARIADB_PASSWORD: ojscs
      MARIADB_ROOT_PASSWORD: rootcs
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    volumes:
      - cs_db:/var/lib/mysql
    networks: [inside]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 8s
      timeout: 5s
      retries: 20

  ojs:
    image: pkpofficial/ojs:3_4_0-4
    container_name: ajam-cs-ojs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVERNAME: ${SERVERNAME:-localhost}
      PKP_TOOL: ojs
      PKP_VERSION: 3_4_0-4
      PKP_CLI_INSTALL: 0
      OJS_DB_HOST: db
      OJS_DB_NAME: ojs
      OJS_DB_USER: ojs
      OJS_DB_PASSWORD: ojscs
      HTTP_PORT: 80
    ports:
      - "8080:80"          # forwarded by Codespaces
    volumes:
      - cs_files:/var/www/files
      - cs_public:/var/www/html/public
    networks: [inside]

networks:
  inside:
    driver: bridge

volumes:
  cs_db:
  cs_files:
  cs_public:
