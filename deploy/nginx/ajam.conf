# AJAM front door
#   /      → static Astro site (built into ./dist)
#   /ojs   → Open Journal Systems (reverse-proxied to the ojs container)

upstream ojs_backend {
    server ojs:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 256M;   # allow large manuscript / supplementary uploads

    # ---- Open Journal Systems under /ojs ----
    # The /ojs prefix is PASSED THROUGH (no trailing slash on proxy_pass). The
    # OJS container's Apache has `Alias /ojs -> docroot`, so it resolves /ojs/...
    # correctly and keeps SCRIPT_NAME = /ojs/index.php — which makes OJS emit
    # correct /ojs-prefixed asset URLs. $http_host preserves the :port.
    location /ojs {
        proxy_pass http://ojs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_read_timeout 300s;

        # The public reading interface lives on the static site, so hide OJS's
        # primary tab bar (Current / Archive / About). Visitors are also sent
        # straight to login by OJS's restrictSiteAccess setting. Disable upstream
        # compression so sub_filter can rewrite the HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<style>#navigationPrimary,.pkp_navigation_primary_row{display:none!important;}</style></head>';
    }

    # ---- Static Astro site ----
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # long-cache hashed assets emitted by Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
