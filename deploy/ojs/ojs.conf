# Apache vhost for OJS served under the /ojs subpath.
# Replaces the image default (/etc/apache2/conf.d/ojs.conf).
#
# Alias /ojs -> docroot makes Apache resolve /ojs/lib/..., /ojs/index.php, etc.
# against /var/www/html, and keeps SCRIPT_NAME = /ojs/index.php so OJS computes
# its base path as "/ojs" and emits correct asset URLs. Nginx passes the full
# /ojs/... path through (no prefix stripping).

LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule expires_module modules/mod_expires.so

<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www/html
	RewriteEngine on
	AcceptPathInfo On

	Alias /ojs /var/www/html

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted

		RewriteEngine on
		# Route everything that is not a real file/dir through index.php,
		# preserving the /ojs base via RewriteBase.
		RewriteBase /ojs
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:443>
	ServerName localhost
	DocumentRoot /var/www/html
	SSLEngine on
	SSLCertificateFile /etc/ssl/apache2/server.pem
	SSLCertificateKeyFile /etc/ssl/apache2/server.key
	PassEnv HTTPS
	RewriteEngine on
	AcceptPathInfo On

	Alias /ojs /var/www/html

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
		RewriteEngine on
		RewriteBase /ojs
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
